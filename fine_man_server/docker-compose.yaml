services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: fine_man
      POSTGRES_PASSWORD: "gXJ-qFb_-k9Cs4az_Dl5QFBmpFcRbEtE"
    volumes:
      - fine_man_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "d-iZD4q3mUtiNFQr5tZirQu1kUuWBzOc"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: fine_man_test
      POSTGRES_PASSWORD: "TLiGdWzrWU4coJFzf82ylGkyAFfXO3Jj"
    volumes:
      - fine_man_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "bOoFtO1p1vppmu4Sm80etEUFl-HRYtxf"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  fine_man_data:
  fine_man_test_data:
